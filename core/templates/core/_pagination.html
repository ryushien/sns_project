{# ページ送り。page_obj.has_other_pages のときだけ表示 #}
{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="ページ送り">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}" rel="prev">&laquo; 前へ</a>
    {% else %}
      <span class="is-disabled" aria-disabled="true">&laquo; 前へ</span>
    {% endif %}
    <span class="page-status">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}" rel="next">次へ &raquo;</a>
    {% else %}
      <span class="is-disabled" aria-disabled="true">次へ &raquo;</span>
    {% endif %}
  </nav>
{% endif %}
