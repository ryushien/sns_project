{% extends 'core/base.html' %}

{% block show_gif %}{% endblock %}

{% block content %}
<h2>新規スレッド作成</h2>

{% if error %}
  <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  <p>
    タイトル：<br>
    <input type="text" name="title" size="60" required>
  </p>
  <p>
    本文（>>1）：<br>
    <textarea name="content" rows="4" cols="60" required></textarea>
  </p>
  <button type="submit">スレッドを立てる</button>
</form>

{% endblock %}
