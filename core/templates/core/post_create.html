{% extends 'core/base.html' %}

{% block title %}新規スレッド | Mini SNS{% endblock %}

{% block content %}
<p class="meta"><a href="{% url 'thread_list' %}">← スレッド一覧</a></p>

<section class="card">
  <h1>新規スレッド</h1>

  {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="field">
      <label for="id_title">タイトル</label>
      <input id="id_title" type="text" name="title" maxlength="200" required
             value="{{ form.title.value|default:'' }}">
    </div>
    <div class="field">
      <label for="id_content">本文（1レス目）</label>
      <textarea id="id_content" name="content" maxlength="2000" required>{{ form.content.value|default:'' }}</textarea>
    </div>
    <div class="field">
      <label for="id_image">画像（任意）</label>
      <input id="id_image" type="file" name="image" accept="image/jpeg,image/png,image/gif,image/webp">
      <span class="help-text">jpg / png / gif / webp、5MBまで</span>
    </div>
    <div class="form-actions">
      <a class="btn btn-ghost" href="{% url 'thread_list' %}">キャンセル</a>
      <button type="submit" class="btn btn-primary">スレッドを立てる</button>
    </div>
  </form>
</section>
{% endblock %}
