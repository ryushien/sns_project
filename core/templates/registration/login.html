{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <style>
    .login-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .login-header img {
      width: 50px;
      height: 50px;
    }
  </style>
</head>
<body>
  <div class="login-header">
    <h1>ログイン</h1>
    <img src="{% static 'core/shiroko-dance.gif' %}" alt="shiroko">
  </div>

  <!-- 以下、ログインフォーム -->
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ログイン</button>
  </form>
</body>
</html>
